<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynapsePro Gamification</title>
<style>
  :root{
    color-scheme:light;
    --accent:#0071D3; --accent-bright:#007AFF;
    --accent-soft:rgba(0,113,211,0.10);
    --bg:#f5f5f7; --card:#ffffff; --border:rgba(0,0,0,0.08);
    --text:#1d1d1f; --muted:#6e6e73; --track:#e9e9ec;
    --green:#248A3D;
  }
  html.dark, body.dark{
    color-scheme:dark;
    --accent-soft:rgba(10,132,255,0.16);
    --bg:#1c1c1e; --card:#2a2a2c; --border:rgba(255,255,255,0.08);
    --text:#f5f5f7; --muted:#9a9aa0; --track:#3a3a3c;
    --green:#4CC763;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:13px;
    padding:12px 12px 18px;
  }
  ::-webkit-scrollbar{width:0;height:0;}

  #wrap{opacity:0;}
  body.ready #wrap{opacity:1;transition:opacity .35s ease;}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px;margin-bottom:10px;
  }
  .card-label{
    font-size:10px;font-weight:650;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--muted);
  }

  /* celebration-popup toggle */
  #popupsCard{padding:12px 16px;}
  .popups-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    cursor:pointer;user-select:none;}
  .popups-row input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex-shrink:0;}

  /* ── Hero ── */
  .hero{text-align:center;padding:24px 16px 18px;}
  #badge{width:124px;height:124px;object-fit:contain;display:block;margin:0 auto;}
  .level-chip{
    display:inline-block;margin-top:14px;padding:4px 13px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent-bright);
    font-size:12px;font-weight:650;letter-spacing:0.01em;
  }
  #rankName{font-size:19px;font-weight:750;letter-spacing:-0.02em;margin:9px 0 16px;line-height:1.25;}
  .xpbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;}
  .xpbar .fill{
    height:100%;width:0;border-radius:5px;background:var(--accent);
    transition:width 1s cubic-bezier(.3,.8,.3,1);
  }
  .xp-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .xp-meta .pct{font-weight:650;color:var(--accent-bright);}

  /* ── Stats: one card, two halves with a hairline divider ── */
  .stats{display:flex;align-items:stretch;padding:12px 4px;}
  .stat{flex:1;min-width:0;text-align:center;padding:2px 8px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .stat-divider{width:1px;background:var(--border);margin:2px 0;flex-shrink:0;}
  .stat .card-label{margin-bottom:2px;}
  .stat-value{
    font-size:15.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .stat-value.goal{color:var(--accent-bright);}
  .stat-sub{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .stat-sub.pos{color:var(--green);font-weight:600;}

  /* ── Challenge ── */
  .ch-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .ch-chip{
    padding:2px 9px;border-radius:12px;background:var(--accent-soft);
    color:var(--accent-bright);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;
  }
  .ch-chip.done{background:transparent;color:var(--green);padding-right:0;}
  #challengeText{margin:0 0 12px;line-height:1.5;font-size:13px;}
  .ch-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .cbar{flex:1;height:10px;border-radius:6px;background:var(--track);overflow:hidden;}
  .cbar .fill{height:100%;width:0;border-radius:6px;background:var(--accent);transition:width .6s ease;}
  .cprog{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:550;}
  #challengeBtn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;border:none;border-radius:9px;padding:9px 14px;
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    color:#fff;background:var(--accent);transition:filter .15s,opacity .15s;
  }
  #challengeBtn:hover:not(:disabled){filter:brightness(1.07);}
  #challengeBtn:disabled{opacity:.4;cursor:default;}
  #challengeBtn.done{
    background:transparent;border:1px solid var(--border);color:var(--green);opacity:1;
  }
  #challengeBtn svg{width:13px;height:13px;display:none;}
  #challengeBtn.done svg{display:block;}

  /* ── Ranks grid ── */
  .ranks .card-label{display:block;text-align:center;margin-bottom:12px;}
  .rank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;}
  .rank-item{
    position:relative;width:54px;height:54px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;
  }
  .rank-item:hover{transform:scale(1.08);z-index:2;}
  .rank-item img{width:50px;height:50px;object-fit:contain;border-radius:10px;}
  .rank-item.locked img{filter:grayscale(1);opacity:.28;}
  .rank-item.locked .lock{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }
  .rank-item.locked .lock svg{width:14px;height:14px;color:var(--muted);opacity:.8;}
  .rank-item.current{box-shadow:inset 0 0 0 2px var(--accent-bright);}

  /* ── Guide ── */
  .guide details summary{
    list-style:none;cursor:pointer;text-align:center;
    font-size:10px;font-weight:650;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);
  }
  .guide details summary::-webkit-details-marker{display:none;}
  .guide details summary::after{content:" ▾";font-size:10px;}
  .guide details[open] summary::after{content:" ▴";}
  .guide-body{font-size:11.5px;line-height:1.55;color:var(--text);margin-top:10px;}
  .guide-body p{margin:0 0 6px;}
  .guide-body ul{margin:2px 0 8px;padding-left:18px;}
  .guide-body .tip{color:var(--muted);font-style:italic;}
</style>
<script>
  /* Apply dark mode BEFORE the first paint (avoids a white flash) —
     Anki propagates its theme via prefers-color-scheme. */
  try{
    if(window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.add('dark');
  }catch(e){}
</script>
</head>
<body>
<div id="wrap">
  <section class="card hero">
    <img id="badge" alt="">
    <div><span class="level-chip" id="levelChip">Level ?</span></div>
    <h1 id="rankName">&nbsp;</h1>
    <div class="xpbar"><div class="fill" id="xpFill"></div></div>
    <div class="xp-meta">
      <span id="xpText">&nbsp;</span>
      <span class="pct" id="xpPct"></span>
    </div>
  </section>

  <section class="card stats">
    <div class="stat">
      <div class="card-label" id="streakLabel">Streak</div>
      <div class="stat-value" id="streakDays">?</div>
      <div class="stat-sub pos" id="streakXp">&nbsp;</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="card-label" id="goalLabel">Next Goal</div>
      <div class="stat-value goal" id="goalRank">&nbsp;</div>
      <div class="stat-sub" id="goalSub">&nbsp;</div>
    </div>
  </section>

  <section class="card" id="challengeCard">
    <div class="ch-head">
      <span class="card-label" id="challengeLabel">Daily Challenge</span>
      <span class="ch-chip" id="challengeChip"></span>
    </div>
    <p id="challengeText">&nbsp;</p>
    <div class="ch-bar-row">
      <div class="cbar"><div class="fill" id="challengeFill"></div></div>
      <span class="cprog" id="challengeProg">&nbsp;</span>
    </div>
    <button id="challengeBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="challengeBtnText">&nbsp;</span>
    </button>
  </section>

  <section class="card ranks">
    <span class="card-label" id="ranksLabel">All Ranks</span>
    <div class="rank-grid" id="rankGrid"></div>
  </section>

  <section class="card guide">
    <details>
      <summary id="guideLabel">How it works</summary>
      <div class="guide-body" id="guideBody"></div>
    </details>
  </section>

  <section class="card" id="popupsCard">
    <label class="popups-row" for="popupsToggle" title="">
      <span>
        <span class="card-label" id="popupsLabel" style="display:block;">Celebration popups</span>
      </span>
      <input type="checkbox" id="popupsToggle">
    </label>
  </section>
</div>

<script>
  var _labels = {};
  var _prev = { level: null, completed: null };
  var _badge = { gif: '', png: '', dur: 3000, timer: null };
  var _lockSvg = '<span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>';
  var _checkSvg = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><polyline points="20 6 9 17 4 12"/></svg>';

  function bridge(action){ try{ console.log('SYNAPSEPRO_GAMI:'+action); }catch(e){} }
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(tpl){ // sequentially replaces each {} with the next argument
    var args = Array.prototype.slice.call(arguments, 1), i = 0;
    return String(tpl||'').replace(/\{\}/g, function(){ return args[i] != null ? args[i++] : ''; });
  }
  function num(n){ try{ return Number(n).toLocaleString(); }catch(e){ return String(n); } }

  function applyColors(c){
    if(!c) return;
    var r = document.documentElement.style;
    function set(name, val){ if(val) r.setProperty(name, val); }
    set('--accent', c.accent); set('--accent-bright', c.accentBright);
    set('--bg', c.bg); set('--card', c.card); set('--border', c.border);
    set('--text', c.text); set('--muted', c.muted); set('--track', c.track);
  }

  // Play the badge GIF once, then swap to the still image extracted from the
  // GIF's LAST frame (generated Python-side, pixel-identical dimensions and
  // content). It is pre-decoded during playback so the swap is seamless.
  var _still = null;
  function playBadge(){
    var img = document.getElementById('badge');
    if(_badge.timer){ clearTimeout(_badge.timer); _badge.timer = null; }
    if(!_badge.gif){ if(_badge.png) img.src = _badge.png; return; }
    // Cache-buster forces the GIF to restart from frame 0.
    img.src = _badge.gif + (_badge.gif.indexOf('?') < 0 ? '?r=' : '&r=') + Date.now();
    if(_badge.png){
      _still = new Image();          // pre-decode while the GIF plays
      _still.src = _badge.png;
      // Swap just before the loop would restart, so the last frame sticks.
      _badge.timer = setTimeout(function(){
        _badge.timer = null;
        img.src = _badge.png;
      }, Math.max(200, _badge.dur - 60));
    }
  }
  window.replayBadge = playBadge;

  var _errors = {};
  function etr(source){ return Object.prototype.hasOwnProperty.call(_errors, source) ? _errors[source] : source; }

  window.initGamification = function(d){
    try{
      d = d || {}; _labels = d.labels || {}; _errors = d.errors || {};
      if(d.isDark){ document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
      else{ document.documentElement.classList.remove('dark'); document.body.classList.remove('dark'); }
      applyColors(d.colors);
      document.title = _labels.title || 'SynapsePro Gamification';

      // static section labels
      document.getElementById('goalLabel').textContent      = _labels.nextGoal   || 'Next Goal';
      document.getElementById('streakLabel').textContent    = _labels.streak     || 'Streak';
      document.getElementById('challengeLabel').textContent = _labels.challenge  || 'Daily Challenge';
      document.getElementById('ranksLabel').textContent     = _labels.allRanks   || 'All Ranks';
      document.getElementById('guideLabel').textContent     = _labels.how        || 'How it works';

      // celebration-popup toggle (persisted Python-side via the bridge)
      var pt = document.getElementById('popupsToggle');
      if(pt){
        pt.checked = (d.popupsEnabled !== false);
        var prow = document.querySelector('.popups-row');
        if(prow) prow.title = _labels.popupsHint || '';
        document.getElementById('popupsLabel').textContent = _labels.popups || 'Celebration popups';
        if(!pt._wired){
          pt._wired = true;
          pt.addEventListener('change', function(){ bridge('popups:' + (pt.checked ? '1' : '0')); });
        }
      }

      // badge: play the GIF once on first render, on level-up and when the
      // daily challenge gets completed — otherwise stay on the static frame.
      var first = (_prev.level === null);
      var completedNow = !!(d.challenge && d.challenge.completed);
      var replay = first || d.level !== _prev.level || (completedNow && _prev.completed === false);
      _prev.level = d.level; _prev.completed = completedNow;
      var badge = document.getElementById('badge');
      _badge.gif = d.badge || ''; _badge.png = d.badgeStatic || '';
      _badge.dur = d.badgeDurationMs || 3000;
      badge.style.display = (_badge.gif || _badge.png) ? '' : 'none';
      badge.title = d.rankName || '';
      if(replay){
        playBadge();
      } else if(!_badge.timer){
        // no animation in flight → make sure the still image is shown
        if(_badge.png){ badge.src = _badge.png; }
        else if(_badge.gif && !badge.src){ badge.src = _badge.gif; }
      }

      // hero
      document.getElementById('levelChip').textContent = fmt(_labels.level || 'Level {}', d.level);
      document.getElementById('rankName').textContent = d.rankName || '?';
      var pct = Math.max(0, Math.min(100, d.progressPct || 0));
      document.getElementById('xpFill').style.width = pct + '%';
      var neededStr = (d.xpNeeded == null) ? 'MAX' : num(d.xpNeeded);
      var xpText = document.getElementById('xpText');
      xpText.textContent = num(d.xp) + ' / ' + neededStr + ' XP';
      document.getElementById('xpPct').textContent = (d.xpNeeded == null) ? '' : pct + '%';
      if(d.remainingXp != null) xpText.title = fmt(_labels.xpNeededTip || 'Needed for next level: {}', num(d.remainingXp));

      // streak stat
      var streakTpl = (d.streak === 1) ? (_labels.dayStreak || '{} Day') : (_labels.daysStreak || '{} Days');
      document.getElementById('streakDays').textContent = fmt(streakTpl, d.streak);
      document.getElementById('streakXp').textContent = '+' + num(d.streakXp) + ' XP';

      // next goal stat
      if(d.nextGoal){
        document.getElementById('goalRank').textContent = d.nextGoal.name;
        document.getElementById('goalSub').textContent  = fmt(_labels.onlyXp || 'Only {} XP left', num(d.nextGoal.xp));
      } else {
        document.getElementById('goalRank').textContent = _labels.maxRank  || 'Maximum Rank';
        document.getElementById('goalSub').textContent  = _labels.congrats || 'Congratulations!';
      }

      // challenge
      var ch = d.challenge || {};
      var btn  = document.getElementById('challengeBtn');
      var btnText = document.getElementById('challengeBtnText');
      var chip = document.getElementById('challengeChip');
      document.getElementById('challengeText').textContent = ch.text || '';
      var cpct = ch.target > 0 ? Math.max(0, Math.min(100, Math.round((ch.cur / ch.target) * 100))) : 0;
      if(ch.completed) cpct = 100;
      document.getElementById('challengeFill').style.width = cpct + '%';
      document.getElementById('challengeProg').textContent = (ch.cur != null ? ch.cur : '?') + '/' + (ch.target != null ? ch.target : '?');
      chip.classList.toggle('done', !!ch.completed);
      chip.innerHTML = ch.completed ? _checkSvg : (cpct + '%');
      btn.classList.toggle('done', !!ch.completed);
      if(ch.completed){
        btnText.textContent = _labels.completed || 'Completed';
        btn.disabled = true; btn.title = '';
      } else {
        btnText.textContent = fmt(_labels.claim || 'Claim +{} XP', num(ch.xpReward));
        btn.disabled = !ch.achieved;
        btn.title = ch.achieved ? '' : fmt(_labels.notYet || 'Challenge not completed yet ({}/{}).', ch.cur, ch.target);
      }

      // ranks grid
      var grid = document.getElementById('rankGrid');
      grid.innerHTML = (d.ranks || []).map(function(r){
        var cls = 'rank-item' + (r.unlocked ? '' : ' locked') + (r.current ? ' current' : '');
        var tip = fmt(_labels.lvlPlus || 'Lvl {}+: {}', r.level, r.name) + (r.unlocked ? '' : ' ' + (_labels.locked || '(Locked)'));
        var img = r.img ? '<img src="'+esc(r.img)+'" alt="">' : '?';
        return '<div class="'+cls+'" title="'+esc(tip)+'">'+img+(r.unlocked ? '' : _lockSvg)+'</div>';
      }).join('');

      // guide (pre-translated HTML from Python)
      if(d.guideHtml) document.getElementById('guideBody').innerHTML = d.guideHtml;

      if(!document.body.classList.contains('ready')) document.body.classList.add('ready');
    }catch(e){ console.log('SYNAPSEPRO_GAMI:err:'+e); }
  };

  document.getElementById('challengeBtn').addEventListener('click', function(){
    this.disabled = true;
    bridge('complete');
  });

  document.addEventListener('DOMContentLoaded', function(){ bridge('ready'); });
</script>

    <script>
    /* ── SynapsePro global error reporter ─────────────────────────────────
       Self-contained (inline styles, no page-CSS dependencies): invisible
       until a JS error occurs, then shows a dismissible banner with the
       real traceback so users can report actionable bugs instead of
       "buttons are not working". Never throws itself. */
    (function() {
        if (window.__spReportError) return;
        function isDark() {
            try {
                if (document.documentElement.classList.contains('nightMode') || document.body.classList.contains('nightMode')
                    || document.documentElement.classList.contains('dark') || document.body.classList.contains('dark')) return true;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) { return false; }
        }
        function ensureBanner() {
            var b = document.getElementById('sp-error-banner');
            if (b) return b;
            if (!document.body) return null;
            var dark = isDark();
            b = document.createElement('div');
            b.id = 'sp-error-banner';
            b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483000;display:none;'
                + 'font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:left;'
                + 'padding:12px 18px;box-shadow:0 -6px 24px rgba(0,0,0,0.25);border-top:2px solid #dc3545;'
                + (dark ? 'background:#2c2c2c;color:#e0e0e0;' : 'background:#ffffff;color:#333333;');
            var btnCss = 'margin-right:8px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;border-radius:7px;'
                + (dark ? 'background:#303030;color:#e0e0e0;border:1px solid #555;' : 'background:#fff;color:#333;border:1px solid #ccc;');
            var preCss = 'display:none;max-height:140px;overflow:auto;white-space:pre-wrap;word-break:break-word;'
                + 'font-size:11px;border-radius:6px;padding:8px;margin:0 0 8px 0;'
                + (dark ? 'background:#404040;border:1px solid #555;' : 'background:#f5f5f5;border:1px solid #ccc;');
            b.innerHTML = '<div style="font-weight:700;color:#dc3545;margin-bottom:4px;">' + etr('SynapsePro error') + '</div>'
                + '<div class="sp-eb-msg" style="margin-bottom:6px;word-break:break-word;"></div>'
                + '<pre class="sp-eb-pre" style="' + preCss + '"></pre>'
                + '<div><button type="button" data-spact="details" style="' + btnCss + '">' + etr('Show details') + '</button>'
                + '<button type="button" data-spact="copy" style="' + btnCss + '">' + etr('Copy error') + '</button>'
                + '<button type="button" data-spact="dismiss" style="' + btnCss + '">' + etr('Dismiss') + '</button></div>';
            document.body.appendChild(b);
            b.addEventListener('click', function(e) {
                var act = e.target && e.target.getAttribute && e.target.getAttribute('data-spact');
                if (act === 'dismiss') b.style.display = 'none';
                if (act === 'details') {
                    var pre = b.querySelector('.sp-eb-pre');
                    var open = pre.style.display === 'block';
                    pre.style.display = open ? 'none' : 'block';
                    e.target.textContent = open ? etr('Show details') : etr('Hide details');
                }
                if (act === 'copy') {
                    var text = b.querySelector('.sp-eb-msg').textContent + '\n\n' + b.querySelector('.sp-eb-pre').textContent;
                    try { navigator.clipboard.writeText(text); e.target.textContent = etr('Copied!'); setTimeout(function() { e.target.textContent = etr('Copy error'); }, 2000); } catch (err) {}
                }
            });
            return b;
        }
        window.__spReportError = function(err, context) {
            try {
                var msg = (err && err.message) ? err.message : String(err);
                var stack = (err && err.stack) ? String(err.stack) : etr('(no stack trace available)');
                console.error('[SynapsePro]' + (context ? ' [' + context + ']' : ''), err);
                var show = function() {
                    var b = ensureBanner();
                    if (!b) return;
                    b.querySelector('.sp-eb-msg').textContent = (context ? context + ': ' : '') + msg
                        + ' — ' + etr('Your data is safe. Please screenshot the details and send them to help.synapse.pro@gmail.com.');
                    b.querySelector('.sp-eb-pre').textContent = stack;
                    b.style.display = 'block';
                };
                if (document.body) show();
                else document.addEventListener('DOMContentLoaded', show);
            } catch (e) { try { console.error('[SynapsePro] error while reporting error', e, err); } catch (e2) {} }
        };
        window.addEventListener('error', function(e) {
            if (e.error && (e.error.message || e.error.stack)) window.__spReportError(e.error, etr('Unexpected error'));
            else console.warn('[SynapsePro] Background browser error:', e.message || e);
        });
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.synapseCritical === true) window.__spReportError(e.reason, etr('Unexpected error (async)'));
            else console.warn('[SynapsePro] Background task rejected:', e.reason);
            e.preventDefault();
        });
    })();
    </script>
</body>
</html>
